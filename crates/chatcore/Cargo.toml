[package]
name = "chatcore"
version = "0.1.0"
edition = "2021"
description = "Shared end-to-end messaging core: X3DH + Double Ratchet, wire-compatible with packages/signaling/public/signal.js"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core", "zeroize"] }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
hkdf = "=0.12.4"
hmac = "=0.12.1"
sha2 = "=0.10.9"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
base64 = "=0.22.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
zeroize = { version = "=1.8.1", features = ["derive"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[profile.release]
lto = true
