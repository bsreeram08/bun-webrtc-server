[package]
name = "chatcore-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly build of crates/chatcore for the web app's worker (and the node interop party)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chatcore = { path = "../chatcore", default-features = false, features = ["wasm"] }
# Pinned: the wasm-bindgen CLI used by scripts/build-wasm.ts must be exactly this version.
wasm-bindgen = "=0.2.129"
serde_json = { version = "=1.0.140", features = ["preserve_order"] }

# Size-tuned release build for the browser (scripts/build-wasm.ts). Deterministic: no incremental, one unit.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false
